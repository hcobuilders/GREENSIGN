services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: greensign
      POSTGRES_USER: greensign
      POSTGRES_PASSWORD: greensign
    ports:
      - "5432:5432"
    volumes:
      - greensign_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greensign -d greensign"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  greensign_postgres:
